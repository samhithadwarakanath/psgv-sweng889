services:
  ollama:
    image: ollama/ollama:latest
    container_name: bike-demand-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  app:
    build: .
    container_name: bike-demand-app
    depends_on:
      - ollama
    ports:
      - "8501:8501"
    environment:
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:1b

volumes:
  ollama_data:
